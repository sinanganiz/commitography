# Commitography configuration.
#
# Every key is optional; a key left out keeps its built-in value. The scalar
# values shown below are the built-in values, so this file as written changes
# nothing.
#
# The three list keys work differently. `identities` has no built-in entries.
# `exclude_authors` and `exclude_paths` add to built-in lists of automation
# accounts and generated paths: entries you list are appended to them. Setting
# either to an explicit empty list, `exclude_paths: []`, disables its built-in
# list entirely, which is why both are commented out here.
#
# Every key except `output_dir` is part of the analysis and changes what the
# report measures. `output_dir` only decides where the output is written.

# Merge several git identities belonging to one person. The first email in each
# list is the canonical identifier.
identities: []
#   - name: Jane Doe
#     emails:
#       - jane@example.com
#       - jane.doe@corp.example.com

# Additional authors to exclude, appended to the built-in list, matched
# case-insensitively against display names and email addresses.
# exclude_authors:
#   - release-robot

# Additional paths to exclude from line-based metrics, appended to the built-in
# list. Glob syntax with `**`.
# exclude_paths:
#   - "generated/**"

# A commit changing more lines than this is flagged as a bulk commit and left
# out of line-based metrics. It still counts toward commit and temporal metrics.
outlier_threshold_lines: 10000

# Include merge commits in the analysis.
count_merges: false

# Which timestamp to attribute a commit to: author | committer
date_source: author

# Apply the repository's .mailmap when reading history.
use_mailmap: true

# Replace contributor names with stable pseudonyms. Reports never carry an
# email address, with or without this.
anonymize: false

# Date bounds. Anything git accepts after --since and --until, including a bare
# date and a relative expression. Git completes a bare date with the current
# time of day, so a report records the instant it resolved to rather than the
# words below, and rerunning from that record reads the same commits.
# since: 2025-01-01
# until: 2025-12-31

# Restrict the analysis to one calendar year. 0 analyses the whole history.
# Setting it here filters the analysis; the year-in-review page is still chosen
# with --wrapped.
year: 0

# The window work-type classification treats as recent, in days.
recency_window_days: 30

# Cardinality limits are part of the analysis, and a report states the ones it
# ran under, but they are not yours to set: docs/metrics.md section 12 defines
# them. A value that disagrees with it stops the run.
# cardinality_limits:
#   coupling_pairs: 200

# Where the command writes its output. This is the one operational key: it
# decides where a file goes, changes no number, and never enters a report.
output_dir: ./out
