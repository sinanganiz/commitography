# The two gates of ADR-0057. Both run `make`, so a gate has the same contents
# here and on a developer machine.
#
# Budgets are job timeouts: exceeding one fails the run rather than passing
# slowly (ADR-0054 clause 1). Exceeding a budget is never resolved by removing
# a check; reduce the fixture, move the check from fast to full, or make it
# faster (ADR-0057 clause 3).
#
# Measured durations
#   On the author's Windows machine, with warm module, build and npm caches,
#   after WP-0004 (fixture generation, golden comparison, fixture
#   determinism), one timed run each: fast 1m38s, full 3m09s. Fixture
#   generation takes 25s of each; fixture determinism takes 56s of the full
#   gate.
#
#   Neither gate has been measured on this runner: this workflow has not run
#   yet. The first run measures both, and these numbers are replaced by that
#   measurement.
#
# Third-party actions are pinned to commit revisions, never to tags
# (ADR-0049 clause 8).
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The golden commit message checker reads every commit that changed a
      # golden file, so it needs full history (ADR-0064 clause 1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: toolchain
        run: make toolchain-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make gate-fast

  full:
    name: full gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: toolchain
        run: make toolchain-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make gate-full

  # Part of the full gate. Fixture hashes must be identical on every supported
  # platform (ADR-0019 clause 1), so the determinism checker, which the full
  # job above runs on Linux, also runs on the other two release platforms
  # against the same committed list.
  fixture-determinism:
    name: full gate (fixture determinism, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --no-progress -y
      - id: toolchain
        run: make toolchain-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
      - run: make fixture-determinism
