# The two gates of ADR-0057. Both run `make`, so a gate has the same contents
# here and on a developer machine.
#
# Budgets are job timeouts: exceeding one fails the run rather than passing
# slowly (ADR-0054 clause 1). Exceeding a budget is never resolved by removing
# a check; reduce the fixture, move the check from fast to full, or make it
# faster (ADR-0057 clause 3).
#
# Measured durations
#   fast   1m26s, full 49s, on the author's Windows machine with warm module,
#          build and npm caches. Neither gate has been measured on this runner
#          yet: this workflow has not run. The first run records its own
#          duration, and the numbers above are replaced by it.
#
# Third-party actions are pinned to commit revisions, never to tags
# (ADR-0049 clause 8).
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        run: make toolchain-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make gate-fast

  full:
    name: full gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        run: make toolchain-versions >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make gate-full
