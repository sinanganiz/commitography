# Linter configuration for the rules ADR-0063 clause 1 requires to be enforced
# by linter or formatter configuration (ADR-0055 clause 1).
#
# Run it through `make lint-go`, which pins the golangci-lint version.
#
# Every exclusion below names the record it narrows and the work package that
# removes it (ADR-0055 clause 4). An exclusion is not a precedent: widening a
# rule back to the whole tree is the job of the named package.
#
# Rules in ADR-0063 table 1 whose subject does not exist in the tree yet, with
# the package that introduces it (ADR-0063 clause 6):
#
#   no raw colour, spacing, typography or radius    ADR-0038  WP-0047
#   no imperative DOM manipulation in charts        ADR-0037  WP-0048
#   frontend bundle size budget                     ADR-0053  WP-0053
#
# The three frontend rules need a frontend linter, which is a direct
# dependency in web/package.json.
#
# Known deviations the rules below do not catch, with the package that
# removes each:
#
#   with a year set, internal/core/input.go leaves the    ADR-0008  WP-0017
#     other years out of every family and the identities
#     section, and internal/pipeline/replay, which reads
#     no year (ADR-0074), counts their work-type change
#     events all the same
#
# Two rules from table 1 are enforced by a checker rather than here, because
# this linter's configuration cannot express them (ADR-0055 clause 2):
#
#   Direct dependencies match the allow list   ADR-0049  TestDependencyAllowList
#     compares manifests, not imports.
#   No bare `go` statement                     ADR-0044  TestGoroutineOwnership
#     no bundled linter matches a statement form. Expressing it through
#     gocritic's ruleguard needs the ruleguard DSL as a dependency, which
#     ADR-0049 clause 2 does not allow.
version: "2"

run:
  # Checkers and unit tests are linted with the code they check. The two
  # build-tagged packages under internal/checks/ (dockersmoke, perfcheck) are
  # not loaded without their tags.
  tests: true

linters:
  default: none
  enable:
    # Formatting and vet clean. (ADR-0063 table 1; gofmt is under formatters)
    - govet
    # Package dependency direction, metric family isolation and the
    # internal/checks rule (ADR-0040, ADR-0060, ADR-0066); process execution
    # only where ADR-0065 clause 3 permits it.
    - depguard
    # No direct process clock call; no services in context. (ADR-0042)
    - forbidigo
    # No globals or package-level mutable singletons. (ADR-0042)
    - gochecknoglobals

  settings:
    depguard:
      rules:
        # Package dependency direction (ADR-0040 clause 2, ADR-0060 clause 3,
        # ADR-0066). Each rule covers test files too. Import paths match by
        # prefix, so a denied tree covers every package beneath it.
        #
        #   core            nothing outside core
        #   git             core
        #   metrics         core, git
        #   pipeline stage  core, metrics, git
        #   pipeline root   core, metrics, git, the five stages
        #   storage, server anything above
        #
        # Within core, subpackages import one another in one direction only
        # (ADR-0066 clause 3): model and config import nothing, identity may
        # import model and config, filter may also import identity, and core
        # itself may import all four. The rule below covers model and config.
        # Every other edge against that direction (identity to filter, any
        # subpackage to core) closes an import cycle, which the compiler
        # already rejects, so a lint rule for it could never fire (ADR-0064).
        core-direction:
          list-mode: lax
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/git
              desc: "ADR-0066 clause 3: core imports nothing outside core"
            - pkg: github.com/sinanganiz/commitography/internal/metrics
              desc: "ADR-0040 clause 2: core imports nothing outside core"
            - pkg: github.com/sinanganiz/commitography/internal/pipeline
              desc: "ADR-0040 clause 2: core imports nothing outside core"
            - pkg: github.com/sinanganiz/commitography/internal/storage
              desc: "ADR-0040 clause 2: core imports nothing outside core"
            - pkg: github.com/sinanganiz/commitography/internal/server
              desc: "ADR-0040 clause 2: core imports nothing outside core"
            - pkg: github.com/sinanganiz/commitography/cmd
              desc: "ADR-0040 clause 2: core imports nothing outside core"
        core-model-config:
          list-mode: lax
          files:
            - "**/internal/core/model/**"
            - "**/internal/core/config/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/core
              desc: "ADR-0066 clause 3: core/model and core/config import nothing from the tree"
        git-direction:
          list-mode: lax
          files:
            - "**/internal/git/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/metrics
              desc: "ADR-0066 clause 1: git may import core only"
            - pkg: github.com/sinanganiz/commitography/internal/pipeline
              desc: "ADR-0066 clause 1: git may import core only"
            - pkg: github.com/sinanganiz/commitography/internal/storage
              desc: "ADR-0066 clause 1: git may import core only"
            - pkg: github.com/sinanganiz/commitography/internal/server
              desc: "ADR-0066 clause 1: git may import core only"
            - pkg: github.com/sinanganiz/commitography/cmd
              desc: "ADR-0066 clause 1: git may import core only"
        metrics-direction:
          list-mode: lax
          files:
            - "**/internal/metrics/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/pipeline
              desc: "ADR-0040 clause 2: metrics may import core only"
            - pkg: github.com/sinanganiz/commitography/internal/storage
              desc: "ADR-0040 clause 2: metrics may not import storage"
            - pkg: github.com/sinanganiz/commitography/internal/server
              desc: "ADR-0040 clause 2: metrics may not import server"
            - pkg: github.com/sinanganiz/commitography/cmd
              desc: "ADR-0040 clause 2: metrics may import core only"
        # A family never reads another family (ADR-0024 clause 3), so a
        # metrics package imports no metrics package at all.
        metrics-isolation:
          list-mode: lax
          files:
            - "**/internal/metrics/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/metrics
              desc: "ADR-0040 clause 3: a metric family may not import another metric family"
        pipeline-direction:
          list-mode: lax
          files:
            - "**/internal/pipeline/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/storage
              desc: "ADR-0040 clause 2: pipeline may not import storage"
            - pkg: github.com/sinanganiz/commitography/internal/server
              desc: "ADR-0040 clause 2: pipeline may not import server"
            - pkg: github.com/sinanganiz/commitography/cmd
              desc: "ADR-0040 clause 2: pipeline may import core, metrics and git only"
        # Only the pipeline root composes the stages (ADR-0060 clause 3); a
        # stage imports no other stage and not the root.
        pipeline-stages:
          list-mode: lax
          files:
            - "**/internal/pipeline/*/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/pipeline
              desc: "ADR-0040 clause 2: a pipeline stage may import core, metrics and git only"
        # internal/checks may import anything it verifies; nothing may import
        # it (ADR-0060 clause 2).
        checks-isolation:
          list-mode: lax
          files:
            - $all
            - "!**/internal/checks/**"
          deny:
            - pkg: github.com/sinanganiz/commitography/internal/checks
              desc: "ADR-0060 clause 2: nothing may import internal/checks"
        # Process execution is imported by the git package (ADR-0065
        # clause 1) and by the closed set of sites in clause 3, tests
        # included (clause 7): the verification packages under
        # internal/checks/ and the browser opener. The third category of
        # clause 3, test setup creating a platform construct the standard
        # library cannot express, has no site: the one test that needed such
        # a construct creates it through the Windows API and starts no
        # process, so no path is listed for it.
        #
        # This list is the clause 3 set exactly, and
        # TestProcessExecutionSitesAreTheClosedSet compares the two so that it
        # stays that way. Adding a site requires a superseding record;
        # widening it here is forbidden (ADR-0065 clause 6).
        process-execution:
          list-mode: lax
          files:
            - $all
            - "!**/internal/git/**"
            - "!**/internal/checks/**"
            - "!**/internal/server/browser.go"
          deny:
            - pkg: os/exec
              desc: "ADR-0065: only the git package and the clause 3 sites may import process execution"

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until)$
          pkg: ^time$
          msg: "ADR-0042: read the clock through an injected dependency"
        # Tracing identifiers are the sole exception (ADR-0042 clause 3) and
        # need a suppression naming that clause.
        - pattern: ^context\.WithValue$
          pkg: ^context$
          msg: "ADR-0042: context carries cancellation and deadlines only"
        # The rule above denies the process-execution library by import, and
        # these are the other ways to start one. They are denied everywhere,
        # the git package included: a process is started through os/exec, so
        # that the one chokepoint applies the hardening set rather than a
        # call site reimplementing part of it (ADR-0065 clauses 1 and 2).
        - pattern: ^os\.StartProcess$
          pkg: ^os$
          msg: "ADR-0065: a process is started through the git package, not directly"
        - pattern: ^syscall\.(StartProcess|ForkExec|Exec|CreateProcess)$
          pkg: ^syscall$
          msg: "ADR-0065: a process is started through the git package, not directly"

  # No exclusions. Link-time build metadata is not excluded here either:
  # internal/core/buildinfo.go carries the single in-file suppression of
  # gochecknoglobals that ADR-0061 clause 3 requires, and TestPackageVariables
  # holds the tree to exactly that one. The linter's own allowances, such as
  # a go:embed variable, are the only other package-level variables, and the
  # tree has one: the embedded frontend bundle.

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
